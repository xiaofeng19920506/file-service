# 飞牛必须 Building：file-service-web:nasdl22 / file-service-api:nasdl22

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fileservice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fileservice}
      POSTGRES_DB: fileservice
    volumes:
      - ${NAS_DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fileservice']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - ${NAS_DATA_DIR:-./data}/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  api:
    image: file-service-api:nasdl22
    pull_policy: never
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      STORAGE_BACKEND: fs
      LOCAL_STORAGE_DIR: /data/storage
      DATABASE_URL: postgresql://fileservice:${POSTGRES_PASSWORD:-fileservice}@postgres:5432/fileservice
      REDIS_URL: redis://redis:6379
      PORT: '3000'
      CORS_ORIGIN: ${CORS_ORIGIN:-https://frontend.youtvs.com,https://file-service-frontend-xi.vercel.app}
      WEB_APP_URL: ${WEB_APP_URL:-https://frontend.youtvs.com}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://api.youtvs.com}
      DOWNLOAD_HMAC_SECRET: ${DOWNLOAD_HMAC_SECRET:-replace-with-at-least-16-chars}
      EXPORT_RETENTION_DAYS: ${EXPORT_RETENTION_DAYS:-7}
      YT_DLP_PATH: /usr/local/bin/yt-dlp
      ADMIN_DOWNLOAD_DIR: /data/downloads
      ADMIN_NAS_MEDIA_DIR: /data/media
      ADMIN_NAS_AUDIO_DIR: /data/audio
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - ${NAS_DATA_DIR:-./data}/storage:/data/storage
      - ${NAS_DATA_DIR:-./data}/downloads:/data/downloads
      - ${ADMIN_NAS_MEDIA_HOST:-./data/downloads}:/data/media
      - ${ADMIN_NAS_AUDIO_HOST:-./data/downloads}:/data/audio
    depends_on:
      - postgres
      - redis

  worker:
    image: file-service-worker:yt-dlp1
    pull_policy: never
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      STORAGE_BACKEND: fs
      LOCAL_STORAGE_DIR: /data/storage
      DATABASE_URL: postgresql://fileservice:${POSTGRES_PASSWORD:-fileservice}@postgres:5432/fileservice
      REDIS_URL: redis://redis:6379
      YT_DLP_PATH: /usr/local/bin/yt-dlp
      EXPORT_RETENTION_DAYS: ${EXPORT_RETENTION_DAYS:-7}
    volumes:
      - ${NAS_DATA_DIR:-./data}/storage:/data/storage
    depends_on:
      - postgres
      - redis
      - api

  web:
    image: file-service-web:nasdl22
    pull_policy: never
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '4000'
      BACKEND_URL: http://api:3000
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-4000}:4000'

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    env_file:
      - .env
    command: ['tunnel', '--no-autoupdate', 'run']
    depends_on:
      - web
