# 本地基础设施：仅 Postgres + Redis（MP3 播放器；API/Worker 在本机跑）
# 用法（在仓库根目录）：
#   docker compose -f shared/docker-compose.yml up -d postgres redis

services:
  postgres:
    image: postgres:16-alpine
    container_name: file-service-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: fileservice
      POSTGRES_PASSWORD: fileservice
      POSTGRES_DB: fileservice
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  postgres_data:
